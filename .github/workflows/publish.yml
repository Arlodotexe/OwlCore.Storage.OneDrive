name: Publish to Nuget

on:
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 10.x
    - name: Restore dependencies
      run: dotnet restore OwlCore.Storage.OneDrive.slnx
    - name: Build
      run: dotnet build OwlCore.Storage.OneDrive.slnx -c Release --no-restore
    - name: Publish to NuGet
      run: dotnet nuget push "/home/runner/work/OwlCore.Storage.OneDrive/OwlCore.Storage.OneDrive/src/bin/Release/OwlCore.Storage.OneDrive.*.*.*.nupkg" --skip-duplicate --api-key ${{secrets.NUGET_KEY}} --source https://api.nuget.org/v3/index.json
      